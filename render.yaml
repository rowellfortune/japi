services:
  - type: web
    name: airport-chatbot-api
    runtime: node
    plan: free
    rootDir: airport-chatbot-backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; src/config/env.ts already reads it.
      # The rest are secrets — sync:false makes Render prompt instead of
      # storing them in this file, which is public.
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      # Must exactly match the Hostinger site origin, scheme included,
      # or the browser blocks every API call as a CORS failure.
      - key: CORS_ORIGIN
        sync: false
